name: CI
on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:staged-publish
      - run: pnpm test:dependency-security
      - run: pnpm test:sync-release
      - run: pnpm --filter notcms-sync-action test
      - run: pnpm --filter notcms-sync-action typecheck
      - run: pnpm --filter notcms-sync-action build
      - run: pnpm run build
        working-directory: packages/notcms
      - run: pnpm run test
        working-directory: packages/notcms
      - run: pnpm run build:ci
        working-directory: examples/nextjs-simple-blog-template
