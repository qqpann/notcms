name: CI
on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:docs
      - run: pnpm check:docs
      - run: pnpm test:staged-publish
      - run: pnpm test:sdk-releases
      - run: pnpm test:dependency-security
      - run: pnpm test:sync-release
      - run: pnpm --filter notcms-sync-action test
      - run: pnpm --filter notcms-sync-action build
      - name: Typecheck all workspaces with TypeScript 7
        run: pnpm typecheck
      - run: pnpm run build
        working-directory: packages/notcms
      - name: Test bundled CLI environment loading
        run: node --test scripts/cli-bundle.test.mjs
      - run: pnpm run test
        working-directory: packages/notcms
      - run: pnpm run build:ci
        working-directory: examples/nextjs-simple-blog-template
