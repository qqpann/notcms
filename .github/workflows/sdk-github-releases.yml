name: SDK GitHub Releases

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  schedule:
    # npm owner approval happens after staging; reconcile later approvals too.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sdk-github-releases
  cancel-in-progress: false

jobs:
  releases:
    if: >-
      github.repository == 'qqpann/notcms' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Always run reviewed main code, never a workflow artifact or PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release synchronization
        run: node --test scripts/sdk-github-releases.test.mjs
      - name: Create releases for published npm versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sdk-github-releases.mjs publish
