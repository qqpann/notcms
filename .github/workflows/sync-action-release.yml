name: Sync Action Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-action-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether to prepare or publish
        id: version
        run: node scripts/sync-action-release.mjs decide
      - run: pnpm install --frozen-lockfile
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - run: pnpm test:sync-release
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - run: pnpm --filter notcms-sync-action test
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - run: pnpm --filter notcms-sync-action typecheck
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - name: Build dist
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
        run: pnpm --filter notcms-sync-action build
      - name: Check committed artifacts
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
        id: artifacts
        run: |
          git add -f sync-action/package.json sync-action/dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release PR
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish') && steps.artifacts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=release/sync-action
          PREVIOUS=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git switch -c "$BRANCH"
          git commit -m "chore: prepare sync-action@$VERSION"
          git push --force-with-lease="refs/heads/$BRANCH:$PREVIOUS" origin "HEAD:refs/heads/$BRANCH"
          cat > "$RUNNER_TEMP/sync-release-pr.md" <<'BODY'
          ## English

          ### Description of change
          Prepare the Sync Action version and rebuilt dist for review. After this PR is merged, Sync Action Release publishes immutable version and major tags without pushing to main. Validation: release script tests, Sync Action tests, typecheck and build passed in the preparation run. Base: main; no prerequisite PR.

          ### UI screenshots
          | Before | After |
          | --- | --- |
          | N/A (Action release artifacts only) | N/A (Action release artifacts only) |

          ### Pull-Request Checklist
          - [x] Code is up-to-date with the `main` branch
          - [ ] `pnpm check` passes with this change — N/A (generated release artifacts)
          - [ ] `pnpm test` passes with this change — N/A (no root test script; scoped tests passed)
          - [ ] This pull request links relevant issues as `Fixes #0000` — N/A (no issue)
          - [ ] There are new or updated unit tests validating the change — N/A (existing release and Action tests passed)
          - [ ] Documentation has been updated to reflect this change — N/A (generated version/dist only)
          - [x] The new commits follow conventions outlined in the [conventional commit spec](https://www.conventionalcommits.org/en/v1.0.0/)

          ---

          ## 日本語

          ### 変更内容
          Sync Action のバージョンと再ビルドした dist をレビュー用に準備します。マージ後は Sync Action Release が main へ push せず、バージョンタグとメジャータグを公開します。準備実行でリリーススクリプトのテスト、Action のテスト・型検査・ビルドが成功しました。base: main、先行 PR なし。

          ### UI スクリーンショット
          | 変更前 | 変更後 |
          | --- | --- |
          | なし（Action のリリース成果物のみ） | なし（Action のリリース成果物のみ） |

          ### PR チェックリスト
          - [x] コードが `main` ブランチの最新状態を取り込んでいる
          - [ ] この変更に対する `pnpm check` が成功する — なし（生成されたリリース成果物）
          - [ ] この変更に対する `pnpm test` が成功する — なし（ルートに test スクリプトなし、対象テストは成功）
          - [ ] 関連 Issue を `Fixes #0000` としてリンクしている — なし（Issue なし）
          - [ ] 変更を検証する単体テストを追加・更新している — なし（既存のリリース・Action テストが成功）
          - [ ] 変更に合わせてドキュメントを更新している — なし（バージョン・dist の生成のみ）
          - [x] 新しいコミットが [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) の規約に従っている
          BODY
          PR=$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          TITLE="chore: release sync-action@$VERSION / Sync Action $VERSION を公開"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-release-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-release-pr.md"
          fi
          echo "### Sync Action release PR prepared (not published)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish committed release tags
        if: (steps.version.outputs.action == 'publish' && steps.artifacts.outputs.changed == 'false') || steps.version.outputs.action == 'repair'
        env:
          VERSION_TAG: ${{ steps.version.outputs.versionTag }}
          MAJOR_TAG: ${{ steps.version.outputs.majorTag }}
          RELEASE_SHA: ${{ steps.version.outputs.releaseSha }}
        run: |
          node scripts/sync-action-release.mjs publish
          echo "### Sync Action Released" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Major tag: $MAJOR_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Already released
        if: steps.version.outputs.action == 'skip'
        run: echo "Sync Action release inputs are unchanged; no PR or tags updated." >> "$GITHUB_STEP_SUMMARY"
