name: Sync Action Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-action-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Decide whether to prepare or publish
        id: version
        run: node scripts/sync-action-release.mjs decide
      - run: pnpm install --frozen-lockfile
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - run: pnpm test:sync-release
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - run: pnpm --filter notcms-sync-action test
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - run: pnpm --filter notcms-sync-action typecheck
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
      - name: Build dist
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
        run: pnpm --filter notcms-sync-action build
      - name: Check committed artifacts
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish')
        id: artifacts
        run: |
          git add -f sync-action/package.json sync-action/dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release PR
        if: (steps.version.outputs.action == 'prepare' || steps.version.outputs.action == 'publish') && steps.artifacts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=release/sync-action
          PREVIOUS=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git switch -c "$BRANCH"
          git commit -m "chore: prepare sync-action@$VERSION"
          git push --force-with-lease="refs/heads/$BRANCH:$PREVIOUS" origin "HEAD:refs/heads/$BRANCH"
          cat > "$RUNNER_TEMP/sync-release-pr.md" <<'BODY'
          Prepare the Sync Action version and rebuilt dist for review.

          Validation passed in the preparation run: release script tests, Sync Action tests, typecheck and build.

          After merge, Sync Action Release publishes the version and major tags from the reviewed commit.
          BODY
          PR=$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          TITLE="chore: release sync-action@$VERSION"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-release-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-release-pr.md"
          fi
          echo "### Sync Action release PR prepared (not published)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish committed release tags
        if: (steps.version.outputs.action == 'publish' && steps.artifacts.outputs.changed == 'false') || steps.version.outputs.action == 'repair'
        env:
          VERSION_TAG: ${{ steps.version.outputs.versionTag }}
          MAJOR_TAG: ${{ steps.version.outputs.majorTag }}
          RELEASE_SHA: ${{ steps.version.outputs.releaseSha }}
        run: |
          node scripts/sync-action-release.mjs publish
          echo "### Sync Action Released" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Major tag: $MAJOR_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Already released
        if: steps.version.outputs.action == 'skip'
        run: echo "Sync Action release inputs are unchanged; no PR or tags updated." >> "$GITHUB_STEP_SUMMARY"
